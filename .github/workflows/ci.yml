name: source-qa

on:
  push:
  pull_request:

jobs:
  source-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight QA dependencies
        run: python -m pip install --upgrade pip numpy pandas openpyxl PyYAML joblib Pillow
      - name: Compile source
        run: python -m compileall -q .
      - name: Run release gate
        env:
          SPPS_PLANNER_USER_DATA: ${{ runner.temp }}/spps-planner
        run: python pepforge_cli.py release-gate --root-dir . --output-dir qa_output
